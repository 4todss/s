<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title></title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: #080808 url("jorvcd.jpg") center center / cover no-repeat fixed;
      font-family: Arial, Helvetica, sans-serif;
    }
    .start-cover {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #000;
      cursor: pointer;
      border: 0;
      width: 100%;
      height: 100%;
      padding: 0;
    }
    .start-cover.hidden { display: none; }
    .player {
      position: fixed;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 11;
      width: min(310px, calc(100vw - 40px));
      padding: 13px 17px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, .52);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 8px;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }
    .time-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      color: rgba(245, 242, 232, .88);
      font-size: 11px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
      user-select: none;
    }
    .progress {
      width: 100%;
      height: 4px;
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-radius: 99px;
      outline: none;
      background: rgba(245, 242, 232, .30);
      cursor: pointer;
    }
    .progress::-webkit-slider-thumb {
      appearance: none;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #eeeae0;
      opacity: 0;
    }
    .progress:hover::-webkit-slider-thumb { opacity: 1; }
    .progress::-moz-range-thumb {
      width: 7px; height: 7px; border: 0;
      border-radius: 50%; background: #eeeae0;
      opacity: 0;
    }
    .progress:hover::-moz-range-thumb { opacity: 1; }
    .progress::-moz-range-track {
      height: 3px; border-radius: 99px;
      background: rgba(245, 242, 232, .30);
    }
    .progress::-moz-range-progress {
      height: 3px; border-radius: 99px;
      background: rgba(245, 242, 232, .92);
    }
    .progress::-webkit-slider-runnable-track {
      height: 3px; border-radius: 99px;
      background: linear-gradient(to right,
        rgba(245,242,232,.95) var(--played, 0%),
        rgba(245,242,232,.30) var(--played, 0%));
    }
    .control {
      width: 30px; height: 30px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: #f0eee8;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      opacity: .92;
    }
    .control:hover { opacity: 1; background: rgba(255,255,255,.10); }
    .control:focus-visible, .progress:focus-visible {
      outline: 1px solid #f0eee8;
      outline-offset: 3px;
    }
    .control svg { width: 17px; height: 17px; display: block; }
  </style>
</head>
<body>
  <audio id="audio" src="shvdc.mp3" preload="metadata"></audio>

  <button class="start-cover" id="startCover" type="button" aria-label="Start audio"></button>

  <div class="player" aria-label="Audio playback">
    <div class="time-row" aria-live="off">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>
    <input id="progress" class="progress" type="range" min="0" max="1000"
           value="0" step="1" aria-label="Audio position">
    <button id="toggle" class="control" type="button" aria-label="Play" title="Play">
      <svg id="symbol" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 5v14l11-7z" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <script>
    (() => {
      const audio = document.getElementById('audio');
      const button = document.getElementById('toggle');
      const symbol = document.getElementById('symbol');
      const progress = document.getElementById('progress');
      const startCover = document.getElementById('startCover');
      const currentTimeLabel = document.getElementById('currentTime');
      const durationLabel = document.getElementById('duration');
      let seeking = false;
      let started = false;

      const icons = {
        play: '<path d="M8 5v14l11-7z" fill="currentColor"/>',
        pause: '<path d="M7 5h4v14H7zM14 5h4v14h-4z" fill="currentColor"/>',
        replay: '<path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-4.9 6H4.98A7 7 0 1 0 12 5z" fill="currentColor"/>'
      };

      function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
        const total = Math.floor(seconds);
        const minutes = Math.floor(total / 60);
        const secs = String(total % 60).padStart(2, '0');
        return `${minutes}:${secs}`;
      }

      function updateTimeLabels() {
        currentTimeLabel.textContent = formatTime(audio.currentTime);
        durationLabel.textContent = formatTime(audio.duration);
      }

      function setButton(state) {
        symbol.innerHTML = icons[state];
        const label = state === 'pause' ? 'Pause' : state === 'replay' ? 'Replay' : 'Play';
        button.setAttribute('aria-label', label);
        button.title = label;
      }

      async function startPlayback() {
        if (audio.ended) audio.currentTime = 0;
        try {
          await audio.play();
        } catch (_) {
          setButton('play');
        }
      }

      async function enterSite() {
        if (started) return;
        started = true;
        await startPlayback();
      }

      // Keep the blank black screen visible until audio playback actually begins.
      // The first click starts loading/playing the MP3; then reveal the background
      // and the small playback-only control.
      audio.addEventListener('loadedmetadata', updateTimeLabels);
      audio.addEventListener('durationchange', updateTimeLabels);
      audio.addEventListener('playing', () => {
        startCover.classList.add('hidden');
        setButton('pause');
      });
      startCover.addEventListener('click', enterSite);

      button.addEventListener('click', async () => {
        if (audio.ended) {
          audio.currentTime = 0;
          await startPlayback();
        } else if (audio.paused) {
          await startPlayback();
        } else {
          audio.pause();
        }
      });

      audio.addEventListener('play', () => setButton('pause'));
      audio.addEventListener('pause', () => {
        if (!audio.ended) setButton('play');
      });
      audio.addEventListener('ended', () => {
        updateTimeLabels();
        currentTimeLabel.textContent = formatTime(audio.duration);
        progress.value = 1000;
        progress.style.setProperty('--played', '100%');
        setButton('replay');
      });

      audio.addEventListener('timeupdate', () => {
        updateTimeLabels();
        if (!seeking && Number.isFinite(audio.duration) && audio.duration > 0) {
          const value = Math.round((audio.currentTime / audio.duration) * 1000);
          progress.value = value;
          progress.style.setProperty('--played', `${value / 10}%`);
        }
      });

      progress.addEventListener('input', () => {
        seeking = true;
        const value = Number(progress.value);
        progress.style.setProperty('--played', `${value / 10}%`);
      });
      progress.addEventListener('change', () => {
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          audio.currentTime = (Number(progress.value) / 1000) * audio.duration;
          updateTimeLabels();
        }
        seeking = false;
      });

      // Show the MP3's real duration as soon as its metadata is available.
      updateTimeLabels();

      // No autoplay or queue. The black cover waits for the visitor's click.
    })();
  </script>
</body>
</html>
